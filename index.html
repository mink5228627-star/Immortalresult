<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사건의 전말 | 연구실, 연쇄 · 불사자의 죽음</title>
  <meta name="description" content="연구실, 연쇄와 불사자의 죽음 — 사건의 전말">
  <style>
    :root {
      color-scheme: dark;
      --background: #171717;
      --text: #efede8;
      --muted: #aaa7a2;
      --line: #484644;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family: "Pretendard", "SUIT", "Noto Sans KR", "Malgun Gothic", sans-serif;
      line-height: 1.6;
      word-break: keep-all;
    }

    button {
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 5px;
    }

    .page {
      width: min(640px, calc(100% - 48px));
      margin: clamp(64px, 12vh, 120px) auto 48px;
    }

    .brand {
      margin: 0 0 36px;
      color: var(--muted);
      font-size: 13px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 44px);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -.045em;
    }

    .intro {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .work-list {
      margin-top: 44px;
      border-top: 1px solid var(--line);
    }

    .work-choice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      padding: 28px 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
    }

    .work-title {
      font-size: clamp(20px, 4.8vw, 26px);
      font-weight: 500;
      letter-spacing: -.035em;
    }

    .work-action {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .work-choice:hover .work-action {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .notice {
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .confirmation {
      width: min(420px, calc(100% - 32px));
      max-height: calc(100dvh - 32px);
      padding: 32px;
      border: 1px solid #62605c;
      color: var(--text);
      background: #202020;
    }

    .confirmation::backdrop {
      background: rgba(0, 0, 0, .75);
    }

    .confirmation h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: -.025em;
    }

    .confirmation-work {
      display: block;
      margin: 10px 0;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -.04em;
    }

    .confirmation-warning {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .confirmation-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 28px;
    }

    .confirmation-actions button {
      min-height: 46px;
      padding: 10px;
      border: 1px solid var(--line);
      background: transparent;
      font-size: 14px;
    }

    .confirmation-actions .confirm-open {
      border-color: var(--text);
      color: #202020;
      background: var(--text);
    }

    @media (max-width: 480px) {
      .brand { margin-bottom: 28px; }
      .work-list { margin-top: 36px; }
      .work-choice { padding: 24px 0; }
      .confirmation { padding: 26px 24px; }
      .confirmation-work { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="brand">Dodory Games</p>
      <h1>사건의 전말</h1>
      <p class="intro">플레이한 작품을 선택해 주세요.</p>
    </header>

    <div class="work-list" aria-label="작품 선택">
      <button type="button" class="work-choice"
        data-work="연구실, 연쇄"
        data-archive-destination="https://mink5228627-star.github.io/chainresult/case.html"
        aria-label="연구실, 연쇄 전말 보기">
        <span class="work-title">연구실, 연쇄</span>
        <span class="work-action">전말 보기</span>
      </button>
      <button type="button" class="work-choice"
        data-work="불사자의 죽음"
        data-archive-destination="case.html"
        aria-label="불사자의 죽음 전말 보기">
        <span class="work-title">불사자의 죽음</span>
        <span class="work-action">전말 보기</span>
      </button>
    </div>

    <p class="notice">게임을 마친 뒤 읽어 주세요.</p>
    <p class="notice">플레이를 마쳤다면 <a href="https://discord.gg/KGQCZfM59C" style="color: inherit; text-decoration: underline;">도돌이게임즈 공식 디스코드</a>에서 후기와 해석을 나눠 보세요.</p>
    <noscript>
      <p class="notice">작품 선택 버튼을 사용하려면 자바스크립트를 허용해 주세요.</p>
    </noscript>
  </main>

  <dialog class="confirmation" id="archive-confirmation"
    aria-labelledby="confirmation-title" aria-describedby="confirmation-warning">
    <h2 id="confirmation-title">
      현재 플레이하고 있는 작품이
      <strong class="confirmation-work" id="confirmation-work"></strong>
      맞나요?
    </h2>
    <p class="confirmation-warning" id="confirmation-warning">사건의 결말과 범인이 공개됩니다.</p>
    <div class="confirmation-actions">
      <button type="button" id="confirmation-cancel" autofocus>다시 선택</button>
      <button type="button" class="confirm-open" id="confirmation-open">전말 보기</button>
    </div>
  </dialog>

  <script>
    const confirmation = document.getElementById('archive-confirmation');
    const selectedWork = document.getElementById('confirmation-work');
    let pendingDestination = null;
    let selectedButton = null;

    document.querySelectorAll('[data-archive-destination]').forEach((button) => {
      button.addEventListener('click', () => {
        selectedButton = button;
        pendingDestination = button.dataset.archiveDestination;
        selectedWork.textContent = '《' + button.dataset.work + '》';
        confirmation.showModal();
      });
    });

    document.getElementById('confirmation-cancel').addEventListener('click', () => {
      confirmation.close();
    });

    confirmation.addEventListener('close', () => {
      pendingDestination = null;
      selectedButton?.focus();
    });

    document.getElementById('confirmation-open').addEventListener('click', () => {
      if (!pendingDestination) return;
      const destination = pendingDestination;
      confirmation.close();
      window.location.assign(destination);
    });
  </script>
</body>
</html>
